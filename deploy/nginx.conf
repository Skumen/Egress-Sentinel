# Alternative to Caddy when nginx already serves other sites on this server.
# Copy to /etc/nginx/sites-available/egress-sentinel, adjust server_name and the certificate paths,
# then: ln -s /etc/nginx/sites-available/egress-sentinel /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#
# Certificates: either Let's Encrypt (certbot --nginx -d monitor.example.com) or, if the domain is proxied
# by Cloudflare, a Cloudflare Origin certificate with SSL mode "Full (strict)".
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.example.com;

    ssl_certificate     /etc/ssl/monitor.example.com.crt;
    ssl_certificate_key /etc/ssl/monitor.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
